# Render.yaml configuration for Dating Website deployment

services:
  - type: web
    name: dating-website
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --config gunicorn.conf.py Dating_Website.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        sync: false
    
databases:
  - name: dating-website-db
    databaseName: dating_website_db
    user: dating_website_user
